<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="About me: Software developer and business analyst focused on web applications, databases and BI/analytics, working with ERP and corporate reporting. In spare time, builds 2D games in Unity and tools for RPG / D&amp;D. Data + code + games.">
  <defs>
    <filter id="glow" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12052a"/>
      <stop offset="1" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#05d9e8"/>
      <stop offset="0.5" stop-color="#b026ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity="0.3"/></pattern>
    <!-- cada linha aparece como se fosse digitada -->
    <clipPath id="l1"><rect x="40" y="78" height="30" width="0"><animate attributeName="width" values="0;1120" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="l2"><rect x="40" y="108" height="30" width="0"><animate attributeName="width" values="0;1120" begin="1s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l3"><rect x="40" y="148" height="30" width="0"><animate attributeName="width" values="0;1120" begin="2s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l4"><rect x="40" y="178" height="30" width="0"><animate attributeName="width" values="0;1120" begin="2.6s" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="l5"><rect x="40" y="208" height="30" width="0"><animate attributeName="width" values="0;1120" begin="3.8s" dur="0.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="l6"><rect x="40" y="248" height="30" width="0"><animate attributeName="width" values="0;1120" begin="4.8s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="l7"><rect x="40" y="278" height="30" width="0"><animate attributeName="width" values="0;1120" begin="5.4s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <style>
      .mono { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .b { font-weight: 700; }
      .p { fill: #ff2a6d; }
      .cmd { fill: #05d9e8; }
      .out { fill: #d9d2ff; }
      .hl { fill: #f9f871; }
      .blink { animation: blink 1.1s infinite steps(1); }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>

  <path d="M6 6 H1160 L1194 40 V324 H40 L6 290 Z" fill="url(#bg)"/>
  <path d="M6 6 H1160 L1194 40 V324 H40 L6 290 Z" fill="url(#scan)"/>
  <path d="M6 6 H1160 L1194 40 V324 H40 L6 290 Z" fill="none" stroke="url(#edge)" stroke-width="2" filter="url(#glow)"/>

  <!-- barra da janela -->
  <line x1="6" y1="50" x2="1194" y2="50" stroke="#b026ff" stroke-opacity="0.6"/>
  <circle cx="34" cy="28" r="6" fill="#ff2a6d" filter="url(#glow)"/>
  <circle cx="56" cy="28" r="6" fill="#f9f871" filter="url(#glow)"/>
  <circle cx="78" cy="28" r="6" fill="#39ff14" filter="url(#glow)"/>
  <text x="600" y="33" text-anchor="middle" class="mono" font-size="14" fill="#9f95c9">miguel@night-city: ~/profile</text>

  <g class="mono" font-size="19">
    <text x="40" y="100" clip-path="url(#l1)"><tspan class="p b">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="40" y="130" clip-path="url(#l2)" class="out">Luiz Miguel Cavilha · <tspan class="hl">Software Developer · Business Analyst · Game Developer</tspan></text>

    <text x="40" y="170" clip-path="url(#l3)"><tspan class="p b">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
    <text x="40" y="200" clip-path="url(#l4)" class="out">&gt; Web applications, databases and <tspan class="hl">BI / analytics</tspan>, working daily with ERP and reporting</text>
    <text x="40" y="230" clip-path="url(#l5)" class="out">&gt; Off the clock: <tspan class="hl">2D games in Unity</tspan> and tools for <tspan class="hl">RPG / D&amp;D</tspan></text>

    <text x="40" y="270" clip-path="url(#l6)"><tspan class="p b">$ </tspan><tspan class="cmd">echo $STACK_MOTTO</tspan></text>
    <text x="40" y="300" clip-path="url(#l7)" class="b" fill="#ff2a6d" filter="url(#glow)">data + code + games<tspan class="blink" fill="#05d9e8"> █</tspan></text>
  </g>
</svg>
