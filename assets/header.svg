<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Miguel Cavilha — Software Developer, Business Analyst, Game Developer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05010d"/>
      <stop offset="0.55" stop-color="#14052b"/>
      <stop offset="1" stop-color="#3b0a52"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b0433"/>
      <stop offset="1" stop-color="#05010d"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff35c"/>
      <stop offset="0.5" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b8fbff"/>
      <stop offset="1" stop-color="#05d9e8"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect width="1200" height="360" fill="#fff"/>
      <rect x="0" y="200" width="1200" height="3" fill="#000"/>
      <rect x="0" y="212" width="1200" height="4" fill="#000"/>
      <rect x="0" y="224" width="1200" height="6" fill="#000"/>
      <rect x="0" y="236" width="1200" height="8" fill="#000"/>
    </mask>
    <clipPath id="aboveHorizon"><rect width="1200" height="250"/></clipPath>
    <clipPath id="belowHorizon"><rect y="250" width="1200" height="110"/></clipPath>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.35"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Code', Consolas, 'Courier New', monospace; }
      .display { font-family: 'Arial Black', 'Segoe UI Black', Impact, sans-serif; font-weight: 900; }
      .flicker { animation: flicker 6s infinite; }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.45; }
      }
      .g1 { animation: g1 3.5s infinite steps(1); }
      .g2 { animation: g2 3.5s infinite steps(1); }
      @keyframes g1 {
        0%, 86%, 100% { transform: translate(-3px, 0); opacity: 0.75; }
        88% { transform: translate(-14px, -3px); opacity: 1; }
        91% { transform: translate(9px, 2px); opacity: 1; }
        94% { transform: translate(-6px, 0); opacity: 0.9; }
      }
      @keyframes g2 {
        0%, 86%, 100% { transform: translate(3px, 0); opacity: 0.75; }
        88% { transform: translate(12px, 3px); opacity: 1; }
        91% { transform: translate(-10px, -2px); opacity: 1; }
        94% { transform: translate(5px, 1px); opacity: 0.9; }
      }
      .blink { animation: blink 1.1s infinite steps(1); }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      .scanmove { animation: scanmove 8s linear infinite; }
      @keyframes scanmove { from { transform: translateY(0); } to { transform: translateY(4px); } }
      .sweep { animation: sweep 5s linear infinite; }
      @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(400px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- céu e sol -->
  <rect width="1200" height="360" fill="url(#sky)"/>
  <g clip-path="url(#aboveHorizon)">
    <circle cx="600" cy="250" r="105" fill="#ff2a6d" opacity="0.55" filter="url(#sunGlow)"/>
    <circle cx="600" cy="250" r="95" fill="url(#sun)" mask="url(#sunStripes)"/>
  </g>

  <!-- estrelas -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.2" class="pulse"/>
    <circle cx="190" cy="140" r="1"/>
    <circle cx="320" cy="40" r="1.4" class="pulse"/>
    <circle cx="460" cy="95" r="0.9"/>
    <circle cx="760" cy="50" r="1.2"/>
    <circle cx="880" cy="120" r="1" class="pulse"/>
    <circle cx="1010" cy="70" r="1.4"/>
    <circle cx="1120" cy="150" r="1"/>
    <circle cx="1150" cy="35" r="0.9" class="pulse"/>
    <circle cx="40" cy="190" r="0.9"/>
  </g>

  <!-- chão com grade em perspectiva -->
  <rect y="250" width="1200" height="110" fill="url(#ground)"/>
  <g clip-path="url(#belowHorizon)" stroke="#ff2a6d" stroke-width="1.6" filter="url(#softGlow)">
    <g opacity="0.85">
      <line x1="600" y1="250" x2="-1400" y2="360"/>
      <line x1="600" y1="250" x2="-900" y2="360"/>
      <line x1="600" y1="250" x2="-450" y2="360"/>
      <line x1="600" y1="250" x2="-80" y2="360"/>
      <line x1="600" y1="250" x2="230" y2="360"/>
      <line x1="600" y1="250" x2="480" y2="360"/>
      <line x1="600" y1="250" x2="720" y2="360"/>
      <line x1="600" y1="250" x2="970" y2="360"/>
      <line x1="600" y1="250" x2="1280" y2="360"/>
      <line x1="600" y1="250" x2="1650" y2="360"/>
      <line x1="600" y1="250" x2="2100" y2="360"/>
      <line x1="600" y1="250" x2="2600" y2="360"/>
    </g>
    <!-- linhas horizontais vindo na direção de quem vê -->
    <g stroke="#b026ff">
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
      <line x1="0" x2="1200" y1="250" y2="250"><animate attributeName="y1" values="250;360" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/><animate attributeName="y2" values="250;360" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines="0.55 0 1 1"/></line>
    </g>
  </g>
  <rect x="0" y="249" width="1200" height="2" fill="#05d9e8" filter="url(#glow)"/>

  <!-- título com glitch -->
  <g text-anchor="middle">
    <text x="600" y="128" class="display g1" font-size="86" letter-spacing="8" fill="#ff2a6d">MIGUEL CAVILHA</text>
    <text x="600" y="128" class="display g2" font-size="86" letter-spacing="8" fill="#05d9e8">MIGUEL CAVILHA</text>
    <text x="600" y="128" class="display flicker" font-size="86" letter-spacing="8" fill="url(#title)" filter="url(#glow)">MIGUEL CAVILHA</text>
    <path d="M232 150 H968 L980 162 V186 H244 L232 174 Z" fill="#05010d" fill-opacity="0.82" stroke="#05d9e8" stroke-width="1.5" filter="url(#softGlow)"/>
    <text x="606" y="174" class="mono" font-size="19" letter-spacing="3" fill="#f9f871" filter="url(#softGlow)">SOFTWARE DEVELOPER  //  BUSINESS ANALYST  //  GAME DEVELOPER</text>
  </g>

  <!-- HUD -->
  <g fill="#05010d" fill-opacity="0.8">
    <rect x="26" y="318" width="196" height="26" rx="2"/>
    <rect x="984" y="318" width="190" height="26" rx="2"/>
  </g>
  <g class="mono" font-size="14" fill="#05d9e8" filter="url(#softGlow)">
    <text x="34" y="40">&gt; ./init --profile miguel.cavilha<tspan class="blink" fill="#ff2a6d"> █</tspan></text>
    <text x="1166" y="40" text-anchor="end"><tspan class="blink" fill="#39ff14">●</tspan> ONLINE</text>
    <text x="34" y="336" fill="#ff2a6d">LOC: BRUSQUE · SC · BR</text>
    <text x="1166" y="336" text-anchor="end" fill="#ff2a6d">DATA · CODE · GAMES</text>
  </g>
  <g fill="none" stroke="#05d9e8" stroke-width="2" filter="url(#softGlow)">
    <path d="M14 70 V14 H70"/>
    <path d="M1130 14 H1186 V70"/>
    <path d="M14 290 V346 H70"/>
    <path d="M1130 346 H1186 V290"/>
  </g>

  <!-- scanlines e faixa de varredura -->
  <g class="scanmove"><rect y="-4" width="1200" height="368" fill="url(#scan)"/></g>
  <rect class="sweep" width="1200" height="40" fill="#05d9e8" opacity="0.05"/>
</svg>
